# 1 VU OAuth smoke. Run sledge auth once, then sledge run.
# Do not put hostnames or tokens in this file.
version: 1
target:
  url: ${env:MCP_URL}
  transport: streamable-http
auth:
  oauth:
    grant: authorization_code
    token_scope: shared
workload:
  model: closed
  vus: 1
  duration: 30s
  iterations: 1
  session:
    mode: per_vu
steps:
  - tools/list: {}
  - tools/call:
      name: ${env:MCP_TOOL}
      arguments: {}
    expect:
      ok: true
      max_duration: 30s
thresholds:
  auth_errors: "== 0"
